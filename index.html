<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KAP Risk Dashboard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;background:#f0f2f5;font-size:14px;color:#1a1a1a}
.header{background:#fff;padding:12px 16px;border-bottom:1px solid #ddd;position:sticky;top:0;z-index:100}
.header h1{font-size:18px;color:#1a1a1a}
.header p{font-size:12px;color:#666;margin-top:2px}
.container{padding:12px;max-width:1400px;margin:0 auto}

/* KPI */
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.kpi{background:#fff;padding:12px;border-radius:6px;border-left:4px solid;text-align:center}
.kpi.blue{border-color:#3b82f6}.kpi.red{border-color:#ef4444}.kpi.yellow{border-color:#f59e0b}.kpi.green{border-color:#10b981}
.kpi-label{font-size:11px;color:#666;font-weight:600;text-transform:uppercase}
.kpi-value{font-size:28px;font-weight:bold;margin-top:4px}
.kpi.blue .kpi-value{color:#3b82f6}.kpi.red .kpi-value{color:#ef4444}.kpi.yellow .kpi-value{color:#f59e0b}.kpi.green .kpi-value{color:#10b981}

/* Filters */
.filters-box{background:#fff;padding:12px;border-radius:6px;margin-bottom:12px;border:1px solid #e5e7eb}
.filter-grid{display:grid;grid-template-columns:repeat(auto-fit, minmax(150px, 1fr));gap:10px;margin-bottom:10px}
.filter-item label{display:block;font-size:11px;font-weight:600;color:#666;margin-bottom:4px}
.filter-item input, .filter-item select{width:100%;padding:8px;border:1px solid #d1d5db;border-radius:4px;font-size:13px}
.risk-tabs{display:flex;gap:6px;flex-wrap:wrap}
.risk-tab{padding:6px 12px;background:#f3f4f6;border:1px solid #d1d5db;border-radius:20px;cursor:pointer;font-size:12px;font-weight:600;transition:all 0.2s}
.risk-tab.active{color:#fff;border-color:transparent}
.risk-tab[data-risk=""].active{background:#3b82f6}
.risk-tab[data-risk="KRITIK"].active{background:#ef4444}
.risk-tab[data-risk="NEGATIF"].active{background:#f59e0b}
.risk-tab[data-risk="NOTR"].active{background:#6b7280}
.risk-tab[data-risk="POZITIF"].active{background:#10b981}

/* Table */
.table-wrap{background:#fff;border-radius:6px;overflow:hidden;border:1px solid #e5e7eb}
.table-header{padding:12px;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center;background:#f9fafb}
.table-header h3{font-size:15px;font-weight:600}
table{width:100%;border-collapse:collapse}
th{background:#f9fafb;padding:10px;text-align:left;font-size:11px;font-weight:600;color:#666;text-transform:uppercase;border-bottom:1px solid #e5e7eb}
td{padding:10px;border-bottom:1px solid #f3f4f6;font-size:13px}
tr:hover{background:#f9fafb}

/* Badges & Buttons */
.badge{display:inline-block;padding:3px 8px;border-radius:10px;font-size:11px;font-weight:600}
.badge-krilik{background:#fee2e2;color:#dc2626}
.badge-negatif{background:#fef3c7;color:#b45309}
.badge-notr{background:#f3f4f6;color:#4b5563}
.badge-pozitif{background:#d1fae5;color:#047857}
.btn{padding:6px 12px;background:#3b82f6;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:12px;font-weight:600;text-decoration:none;display:inline-block;text-align:center}
.btn:hover{background:#2563eb}
.btn-kap{padding:6px 12px;background:#1e3a8a;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:12px;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:5px}
.btn-kap:hover{background:#1e40af}

/* Modal */
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:1000;padding:20px}
.modal.active{display:flex;align-items:center;justify-content:center}
.modal-box{background:#fff;border-radius:8px;max-width:800px;width:100%;max-height:90vh;overflow-y:auto}
.modal-head{padding:16px;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#fff;z-index:10}
.modal-head h2{font-size:18px;font-weight:700}
.modal-close{background:none;border:none;font-size:28px;cursor:pointer;color:#666}
.modal-body{padding:16px}
.section{background:#f9fafb;padding:12px;border-radius:6px;margin-bottom:12px;border:1px solid #e5e7eb}
.section h4{font-size:13px;font-weight:600;margin-bottom:8px;color:#1a1a1a}
.row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #e5e7eb}
.row:last-child{border-bottom:none}
.row-label{font-size:12px;color:#666}
.row-value{font-size:12px;font-weight:600;color:#1a1a1a}
.bar{width:100%;height:6px;background:#e5e7eb;border-radius:3px;margin-top:6px;overflow:hidden}
.bar-fill{height:100%;background:linear-gradient(to right,#10b981,#f59e0b,#ef4444)}
.actions{list-style:none}
.actions li{padding:8px;background:#fff;border-radius:4px;margin-bottom:6px;font-size:12px;color:#4b5563;border:1px solid #e5e7eb}

@media(max-width:768px){
  .kpi-row{grid-template-columns:repeat(2,1fr)}
  .filter-grid{grid-template-columns:1fr 1fr}
  table{font-size:12px}
  th, td{padding:8px}
}
</style>
</head>
<body>

<div class="header">
  <h1>🏦 KAP Risk İzleme Dashboard</h1>
  <p><strong>161</strong> Özel Durum Açıklaması - 17.09.2026</p>
</div>

<div class="container">

  <!-- KPI -->
  <div class="kpi-row">
    <div class="kpi blue"><div class="kpi-label">Toplam ÖDA</div><div class="kpi-value" id="total">0</div></div>
    <div class="kpi red"><div class="kpi-label">Kritik</div><div class="kpi-value" id="kritik">0</div></div>
    <div class="kpi yellow"><div class="kpi-label">Dikkat</div><div class="kpi-value" id="negatif">0</div></div>
    <div class="kpi green"><div class="kpi-label">Pozitif</div><div class="kpi-value" id="pozitif">0</div></div>
  </div>

  <!-- Filters -->
  <div class="filters-box">
    <div class="filter-grid">
      <div class="filter-item">
        <label>📅 Yayınlanma Tarihi</label>
        <input type="date" id="dateFilter" onchange="applyFilters()">
      </div>
      <div class="filter-item">
        <label>🏢 Hisse Kodu / Adı</label>
        <input type="text" id="stockFilter" placeholder="Örn: ALVES" onkeyup="applyFilters()">
      </div>
      <div class="filter-item">
        <label>📌 Konu Başlığı</label>
        <select id="subjectFilter" onchange="applyFilters()">
          <option value="">Tüm Konular</option>
          <option value="Kayyum Atanması">Kayyum Atanması</option>
          <option value="Temerrüt">Temerrüt / Ödeme Güçlüğü</option>
          <option value="Fon Tasfiyesi">Fon Tasfiyesi</option>
          <option value="Pay Geri Alım">Pay Geri Alım</option>
          <option value="Bono İtfası">Bono İtfası</option>
          <option value="Yönetici Değişikliği">Yönetici Değişikliği</option>
          <option value="Rekabet Kurumu">Rekabet Kurumu Kararı</option>
          <option value="Sözleşme">Sözleşme / İhale</option>
        </select>
      </div>
      <div class="filter-item" style="display:flex;align-items:flex-end">
        <button class="btn" style="width:100%;background:#6b7280" onclick="resetFilters()">🔄 Filtreleri Sıfırla</button>
      </div>
    </div>
    <div class="risk-tabs">
      <div class="risk-tab active" data-risk="" onclick="filterRisk('')">Tümü</div>
      <div class="risk-tab" data-risk="KRITIK" onclick="filterRisk('KRITIK')">🔴 Kritik</div>
      <div class="risk-tab" data-risk="NEGATIF" onclick="filterRisk('NEGATIF')">🟡 Dikkat</div>
      <div class="risk-tab" data-risk="NOTR" onclick="filterRisk('NOTR')">⚪ Nötr</div>
      <div class="risk-tab" data-risk="POZITIF" onclick="filterRisk('POZITIF')">🟢 Pozitif</div</div>
  </div>

  <!-- Table -->
  <div class="table-wrap">
    <div class="table-header">
      <h3>📋 Özel Durum Açıklamaları</h3>
      <span id="count" style="font-size:12px;color:#666">0 bildirim</span>
    </div>
    <div style="overflow-x:auto">
      <table>
        <thead>
          <tr>
            <th>Kod</th>
            <th>Şirket</th>
            <th>Konu</th>
            <th>Özet</th>
            <th>Risk</th>
            <th>İşlem</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

</div>

<!-- Modal -->
<div class="modal" id="modal">
  <div class="modal-box">
    <div class="modal-head">
      <h2>📊 Firma Detay Raporu</h2>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>
const data = [
  {id:1,kod:'ALVES',ad:'Alves Kablo San. A.Ş.',konu:'Kayyum Atanması',ozet:'Mahkeme kararı ile kayyum atandı',sektor:'Sanayi',risk:'KRITIK',skor:0.95,tarih:'2026-09-17',aciklama:'Şirket hakkında yürütülen soruşturma kapsamında mahkemece kayyum atanmasına karar verilmiştir.',kap_url:'https://www.kap.org.tr/tr/Bildirim/1664508'},
  {id:2,kod:'TERA',ad:'Tera Portföy Yönetimi A.Ş.',konu:'Fon Tasfiyesi',ozet:'SPK kararı ile fon tasfiye edildi',sektor:'Finans',risk:'KRITIK',skor:0.92,tarih:'2026-09-17',aciklama:'SPK kararı kapsamında bazı yatırım fonlarında temerrüt oluşmuş, tasfiye süreci başlatılmıştır.',kap_url:'https://www.kap.org.tr/tr/Bildirim/1664400'},
  {id:3,kod:'PUSULA',ad:'Pusula Portföy A.Ş.',konu:'Temerrüt',ozet:'Yatırımcı ödemelerinde temerrüt',sektor:'Finans',risk:'KRITIK',skor:0.98,tarih:'2026-09-17',aciklama:'Bazı yatırım fonlarında ödeme güçlüğü nedeniyle temerrüt durumu oluşmuştur.',kap_url:'https://www.kap.org.tr/tr/Bildirim/1664350'},
  {id:4,kod:'MCARD',ad:'Metropal Kurumsal Hiz. A.Ş.',konu:'Pay Geri Alım',ozet:'1.2 Milyar TL geri alım programı',sektor:'Hizmet',risk:'NEGATIF',skor:0.72,tarih:'2026-09-17',aciklama:'Yönetim Kurulu kararı ile azami 1.2 Milyar TL tutarında pay geri alım programı başlatılmıştır.',kap_url:'https://www.kap.org.tr/tr/Bildirim/1664447'},
  {id:5,kod:'LIDFA',ad:'Lider Faktoring A.Ş.',konu:'Bono İtfası',ozet:'50 M TL bono itfa edildi',sektor:'Finans',risk:'POZITIF',skor:0.15,tarih:'2026-09-17',aciklama:'50 Milyon TL anapara tutarlı bononun itfa ödemesi başarıyla gerçekleştirilmiştir.',kap_url:'https://www.kap.org.tr/tr/Bildirim/1664484'},
  {id:6,kod:'TRALT',ad:'Türk Altın İşletmeleri A.Ş.',konu:'Piyasa Gelişmeleri',ozet:'Piyasa dalgalanması bilgilendirmesi',sektor:'Madencilik',risk:'NOTR',skor:0.35,tarih:'2026-09-17',aciklama:'Borsa İstanbul\'da yaşanan dalgalanmalar ve pay fiyat hareketleri hakkında bilgilendirme.',kap_url:'https://www.kap.org.tr/tr/Bildirim/1664447'},
  {id:7,kod:'DMSAS',ad:'Demirsaş Döküm A.Ş.',konu:'Rekabet Kurumu',ozet:'Rekabet Kurumu kararı',sektor:'Sanayi',risk:'NEGATIF',skor:0.75,tarih:'2026-09-17',aciklama:'Rekabet Kurumu tarafından şirket hakkında soruşturma başlatılmıştır.',kap_url:'https://www.kap.org.tr/tr/Bildirim/1660532'},
  {id:8,kod:'SMART',ad:'Smartiks Yazılım A.Ş.',konu:'Sözleşme',ozet:'Yeni sözleşme imzalandı',sektor:'Teknoloji',risk:'POZITIF',skor:0.20,tarih:'2026-09-17',aciklama:'Önemli bir müşteri ile yeni sözleşme imzalanmıştır.',kap_url:'https://www.kap.org.tr/tr/Bildirim/1664828'}
];

let filtered = [...data];
let currentRisk = '';

function render() {
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = filtered.map(n => `
    <tr>
      <td style="font-weight:700;color:#1e3a8a">${n.kod}</td>
      <td>${n.ad}</td>
      <td>${n.konu}</td>
      <td style="color:#666;font-size:12px;max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${n.ozet}</td>
      <td><span class="badge badge-${n.risk.toLowerCase()}">${n.risk}</span></td>
      <td><button class="btn" onclick="showDetail(${n.id})">Detay →</button></td>
    </tr>
  `).join('');

  document.getElementById('count').textContent = filtered.length + ' bildirim';
  document.getElementById('total').textContent = filtered.length;
  document.getElementById('kritik').textContent = filtered.filter(n => n.risk === 'KRITIK').length;
  document.getElementById('negatif').textContent = filtered.filter(n => n.risk === 'NEGATIF').length;
  document.getElementById('pozitif').textContent = filtered.filter(n => n.risk === 'POZITIF').length;
}

function filterRisk(risk) {
  currentRisk = risk;
  document.querySelectorAll('.risk-tab').forEach(t => t.classList.remove('active'));
  document.querySelector(`.risk-tab[data-risk="${risk}"]`).classList.add('active');
  applyFilters();
}

function applyFilters() {
  const dateVal = document.getElementById('dateFilter').value;
  const stockVal = document.getElementById('stockFilter').value.toLowerCase();
  const subjectVal = document.getElementById('subjectFilter').value;

  filtered = data.filter(n => {
    const matchRisk = currentRisk === '' || n.risk === currentRisk;
    const matchDate = dateVal === '' || n.tarih === dateVal;
    const matchStock = stockVal === '' || n.kod.toLowerCase().includes(stockVal) || n.ad.toLowerCase().includes(stockVal);
    const matchSubject = subjectVal === '' || n.konu === subjectVal;
    return matchRisk && matchDate && matchStock && matchSubject;
  });
  render();
}

function resetFilters() {
  document.getElementById('dateFilter').value = '';
  document.getElementById('stockFilter').value = '';
  document.getElementById('subjectFilter').value = '';
  filterRisk('');
}

function showDetail(id) {
  const n = data.find(x => x.id === id);
  if (!n) return;

  document.getElementById('modalBody').innerHTML = `
    <div style="text-align:right;margin-bottom:10px">
      <a href="${n.kap_url}" target="_blank" class="btn-kap">🔗 KAP'ta Orijinal Bildirimi Görüntüle</a>
    </div>
    <div class="section">
      <h4>🏢 Firma Bilgileri</h4>
      <div class="row"><span class="row-label">Hisse Kodu:</span><span class="row-value">${n.kod}</span></div>
      <div class="row"><span class="row-label">Şirket Adı:</span><span class="row-value">${n.ad}</span></div>
      <div class="row"><span class="row-label">Sektör:</span><span class="row-value">${n.sektor}</span></div>
      <div class="row"><span class="row-label">Tarih:</span><span class="row-value">${n.tarih}</span></div>
    </div>
    <div class="section">
      <h4>📋 KAP Bildirimi</h4>
      <div class="row"><span class="row-label">Konu:</span><span class="row-value">${n.konu}</span></div>
      <div class="row"><span class="row-label">Özet:</span><span class="row-value">${n.ozet}</span></div>
      <div style="margin-top:10px"><span class="row-label">Açıklama:</span><p style="margin-top:5px;font-size:12px;color:#4b5563;line-height:1.6">${n.aciklama}</p></div>
    </div>
    <div class="section">
      <h4>⚠️ Risk Analizi</h4>
      <div class="row"><span class="row-label">Risk Seviyesi:</span><span class="row-value"><span class="badge badge-${n.risk.toLowerCase()}">${n.risk}</span></span></div>
      <div class="row"><span class="row-label">Risk Skoru:</span><span class="row-value">${(n.skor * 100).toFixed(0)}%</span></div>
      <div class="bar"><div class="bar-fill" style="width:${n.skor * 100}%"></div></div>
    </div>
    <div class="section">
      <h4>✅ Önerilen Aksiyonlar</h4>
      <ul class="actions">
        ${n.risk === 'KRITIK' ? '<li>🚨 Kredi limitlerini acilen dondur</li><li>🚨 Kredi Komitesi\'ne acil dosya sun</li><li>🚨 Teminat yapısını gözden geçir</li>' : n.risk === 'NEGATIF' ? '<li>⚠️ Likidite rasyolarını yakından izle</li><li>⚠️ Nakit akış analizi talep et</li>' : '<li>✅ Standart izleme prosedürlerini uygula</li>'}
      </ul>
    </div>
  `;
  document.getElementById('modal').classList.add('active');
}

function closeModal() {
  document.getElementById('modal').classList.remove('active');
}

document.getElementById('modal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

// Başlangıç
render();
</script>
</body>
</html>
